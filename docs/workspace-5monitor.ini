# RadukCapture window layout.
# Captured from the arrangement built by hand on 2026-10-12.
#
#   role = <device> [maximized|fullscreen] [placement]
# placement is either x,y,w,h as 0-1 fractions of that
# screen, or @x,y,w,h in exact screen coordinates.
#
# DISPLAY1 and DISPLAY2 are deliberately free for telemetry windows.

[monitors.5]
main   = \\.\DISPLAY5 maximized @-8,-8,1936,1048
skymap = \\.\DISPLAY4 maximized @1082,1072,1936,1048
mount  = \\.\DISPLAY5 @1535,534,210,326
help   = \\.\DISPLAY3 @1133,2228,745,900
aichat = \\.\DISPLAY3 @1910,2376,500,620
goto   = \\.\DISPLAY3 @2430,2225,487,750
