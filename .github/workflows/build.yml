name: Build and test

# Proves a fresh clone builds on a stock Windows machine with no
# D: drive, no rig.ini and no hardware, which is the first thing
# anyone pulling this repository will try.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Every pull request bumps src/Version.h (the owner's rule,
      # 2026-11-12; see that file). It said so for months and the number
      # did not move through about seventy merges, so it is checked here.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          function Ver([string]$t) {
            if ($t -match 'RADUK_VERSION_A\s+"(\d+)\.(\d+)\.(\d+)"') {
              return [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])"
            }
            throw "RADUK_VERSION_A not found in src/Version.h"
          }
          $base = Ver ((git show "origin/${{ github.base_ref }}:src/Version.h") -join "`n")
          $head = Ver (Get-Content src/Version.h -Raw)
          if ($head -le $base) {
            Write-Host "::error file=src/Version.h::Version $head is not above $base on ${{ github.base_ref }}. Every PR bumps PATCH (a completed phase bumps MINOR): see src/Version.h."
            exit 1
          }
          Write-Host "Version $base -> $head"

      # Phase 149.0b: ZWO's names stay inside the ZWO backend (src/core/ASI*)
      # and the emulator of it, so a second camera backend never finds the
      # vendor's types in the app. Comments may name them.
      - name: Vendor names stay in the backend
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem src -Recurse -Include *.h,*.cpp | ForEach-Object {
            $rel = ($_.FullName.Substring((Get-Location).Path.Length + 1)) -replace '\\','/'
            if ($rel -match '^src/core/(ASI.*|CameraEmulator\.h)$') { return }
            $n = 0
            foreach ($line in Get-Content $_.FullName) {
              $n++
              $code = ($line -split '//', 2)[0]
              if ($code -match '\bASI_[A-Z]') { $bad += "${rel}:${n}: $($line.Trim())" }
            }
          }
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "No ZWO names outside src/core/ASI* and the emulator"

      - name: Emulator build
        run: |
          cmake -S . -B build_emu -DRADUK_EMULATOR=ON
          cmake --build build_emu --config Release

      - name: Hardware build
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Bench tests
        shell: pwsh
        run: ./tests/run-tests.ps1
