name: Build and test

# Proves a fresh clone builds on a stock Windows machine with no
# D: drive, no rig.ini and no hardware, which is the first thing
# anyone pulling this repository will try.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Emulator build
        run: |
          cmake -S . -B build_emu -DRADUK_EMULATOR=ON
          cmake --build build_emu --config Release

      - name: Hardware build
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Bench tests
        shell: pwsh
        run: ./tests/run-tests.ps1
