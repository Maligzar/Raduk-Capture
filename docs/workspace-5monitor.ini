# RadukCapture window layout.
# Captured 2026-10-13 after the owner repositioned the cards.
#
#   role = <device> [maximized|fullscreen] [placement]
# placement is either x,y,w,h as 0-1 fractions of that
# screen, or @x,y,w,h in exact screen coordinates.
#
# NOTE: device names on this rig are NOT stable - they have renumbered
# three times in two days. See debt D1 in docs/ROADMAP-Next.md. If the
# windows land on the primary after a driver event, rearrange and press
# Ctrl+Shift+End to re-save.
#
# DISPLAY5 primary  - main capture window, mount controller
# DISPLAY2          - telemetry: histogram, status, sharpness, temperature
# DISPLAY3          - help, AI chat, GoTo
# DISPLAY4          - sky map
# DISPLAY1          - free

[monitors.5]
main        = \\.\DISPLAY5 maximized @-8,-8,1936,1048
mount       = \\.\DISPLAY5 @1516,723,210,326
skymap      = \\.\DISPLAY4 maximized @1350,1072,1936,1048
help        = \\.\DISPLAY3 @1565,2188,745,900
aichat      = \\.\DISPLAY3 @2338,2281,500,620
goto        = \\.\DISPLAY3 @2890,2209,487,711
histogram   = \\.\DISPLAY2 @-451,1147,433,366
status      = \\.\DISPLAY2 @78,1184,900,220
sharpness   = \\.\DISPLAY2 @-515,1580,1746,230
temperature = \\.\DISPLAY2 @-475,1834,1750,210
