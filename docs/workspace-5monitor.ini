# RadukCapture window layout.
# One section per MONITOR COUNT. The app detects how many
# screens are attached at launch and uses the matching
# section, stepping down if there is no exact match.
#
#   role = <device> [id=<interface path>] [maximized|fullscreen] [placement]
# The id is the monitor's device interface path and is
# what placement actually matches on; the device name
# before it is for reading, and this rig renumbers it.
# placement is either x,y,w,h as 0-1 fractions of that
# screen, or @x,y,w,h in exact screen coordinates.
#
# Roles: main skymap goto aichat help motion

