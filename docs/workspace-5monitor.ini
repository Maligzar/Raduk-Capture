# RadukCapture window layout.
# Captured 2026-10-12 from the arrangement left set up after a long
# emulator session.
#
#   role = <device> [maximized|fullscreen] [placement]
# placement is either x,y,w,h as 0-1 fractions of that
# screen, or @x,y,w,h in exact screen coordinates.
#
# NOTE: the display device names changed under us during this session
# (what was DISPLAY5/2/3/4 is now DISPLAY1/6/7/8) after a driver
# re-enumeration. These are the names as of this capture.
#
# DISPLAY1 primary  - main capture window, mount controller
# DISPLAY6          - histogram / sharpness / temperature stack
# DISPLAY7          - help, AI chat, GoTo
# DISPLAY8          - sky map
# DISPLAY5          - free

[monitors.5]
main        = \\.\DISPLAY1 maximized @-8,-8,1936,1048
mount       = \\.\DISPLAY1 @1516,723,210,326
skymap      = \\.\DISPLAY8 maximized @1082,1072,1936,1048
help        = \\.\DISPLAY7 @1133,2228,745,900
aichat      = \\.\DISPLAY7 @1910,2376,500,620
goto        = \\.\DISPLAY7 @2437,2283,487,711
histogram   = \\.\DISPLAY6 @-770,1138,433,366
sharpness   = \\.\DISPLAY6 @-775,1511,1746,286
temperature = \\.\DISPLAY6 @-771,1847,1750,210
