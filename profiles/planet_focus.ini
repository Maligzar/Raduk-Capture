[profile]
name=Planet Focus
[camera]
gain=80
exposure_ms=4.0000
gamma=60
wb_red=52
wb_blue=47
usb_bandwidth=80
high_speed=true
[roi]
width=1920
height=1080
binning=1
img_type=0
[focuser]
position=50000
step_coarse=100
step_fine=10
[mount]
tracking_mode=alt_az
slew_rate=9
goto_target=
[capture]
format=SER
limit_type=frames
limit_value=0
file_prefix=Focus_
[notes]
text=FOCUSING MODE — full sensor so disk is large and easy to see. Low gain prevents saturation hiding diffraction rings. Rack EAF until Jupiter is a large soft blob, then slowly bring in until equatorial bands just appear. Switch to Jupiter profile once sharp. Tip: if totally lost, defocus until you see a large donut shape.
